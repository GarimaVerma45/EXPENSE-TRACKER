{% extends "base.html" %}

{% block title %}Set New Password · Expense Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-6">
  <section class="rounded-2xl border border-slate-800 bg-slate-900/95 p-6 sm:p-8 shadow-xl relative overflow-hidden">
    <!-- Header -->
    <div class="mb-6 text-center">
      <div class="w-12 h-12 rounded-2xl bg-brand/10 border border-brand/20 text-brand flex items-center justify-center text-xl mx-auto mb-3">
        🔒
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Set New Password</h1>
      <p class="text-slate-400 text-xs mt-1">Choose a secure password. This reset link is valid for 10 minutes.</p>
    </div>

    <form method="post" action="{{ url_for('reset_password', token=token) }}" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">New Password</label>
        <div class="relative">
          <input
            id="resetPassword"
            name="password"
            type="password"
            required
            autofocus
            minlength="6"
            placeholder="Min 6 characters"
            class="w-full rounded-xl bg-slate-800 border border-slate-700 pl-3 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
          <button
            type="button"
            onclick="togglePasswordVisibility('resetPassword', 'eyeReset1')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 text-sm">
            <span id="eyeReset1">👁️</span>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Confirm New Password</label>
        <div class="relative">
          <input
            id="resetConfirm"
            name="confirm_password"
            type="password"
            required
            minlength="6"
            placeholder="Repeat new password"
            class="w-full rounded-xl bg-slate-800 border border-slate-700 pl-3 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
          <button
            type="button"
            onclick="togglePasswordVisibility('resetConfirm', 'eyeReset2')"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 text-sm">
            <span id="eyeReset2">👁️</span>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-brand hover:bg-sky-400 text-slate-950 font-bold px-4 py-2.5 text-sm transition-all transform active:scale-95 shadow-lg shadow-brand/20 mt-2">
        Save New Password
      </button>
    </form>
  </section>
</div>

<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      if (icon) icon.textContent = '🙈';
    } else {
      input.type = 'password';
      if (icon) icon.textContent = '👁️';
    }
  }
</script>
{% endblock %}
