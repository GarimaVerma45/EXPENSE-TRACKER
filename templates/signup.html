{% extends "base.html" %}

{% block title %}Sign Up · Expense Tracker{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-6">
  <section class="rounded-2xl border border-slate-800 bg-slate-900/95 p-6 sm:p-8 shadow-xl relative overflow-hidden">
    <!-- Header -->
    <div class="mb-6 text-center">
      <div class="w-12 h-12 rounded-2xl bg-brand/10 border border-brand/20 text-brand flex items-center justify-center text-xl mx-auto mb-3">
        ✨
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Create your account</h1>
      <p class="text-slate-400 text-xs mt-1">Start tracking and budgeting your expenses in seconds.</p>
    </div>

    <form method="post" action="{{ url_for('signup') }}" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Username <span class="text-rose-400">*</span></label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">👤</span>
          <input
            name="username"
            type="text"
            required
            autofocus
            placeholder="e.g., johndoe"
            class="w-full rounded-xl bg-slate-800 border border-slate-700 pl-9 pr-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email Address <span class="text-rose-400">*</span></label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 text-sm">✉️</span>
          <input
            name="email"
            type="email"
            required
            placeholder="e.g., john@example.com"
            class="w-full rounded-xl bg-slate-800 border border-slate-700 pl-9 pr-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Password <span class="text-rose-400">*</span></label>
          <div class="relative">
            <input
              id="signupPassword"
              name="password"
              type="password"
              required
              minlength="6"
              placeholder="Min 6 characters"
              class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 pr-9 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
            <button
              type="button"
              onclick="togglePasswordVisibility('signupPassword', 'eyeIcon1')"
              class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-200 text-xs">
              <span id="eyeIcon1">👁️</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Confirm Password <span class="text-rose-400">*</span></label>
          <div class="relative">
            <input
              id="signupConfirm"
              name="confirm_password"
              type="password"
              required
              minlength="6"
              placeholder="Confirm password"
              class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 pr-9 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand transition-colors" />
            <button
              type="button"
              onclick="togglePasswordVisibility('signupConfirm', 'eyeIcon2')"
              class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-200 text-xs">
              <span id="eyeIcon2">👁️</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Optional Backup Security Question -->
      <div class="pt-1">
        <details class="group text-xs border border-slate-800 rounded-xl p-3 bg-slate-800/40">
          <summary class="cursor-pointer text-slate-400 hover:text-slate-200 font-medium flex items-center justify-between select-none">
            <span>🛡️ Security Question (Optional Backup)</span>
            <span class="group-open:rotate-180 transition-transform">▼</span>
          </summary>
          <div class="space-y-3 pt-3 mt-2 border-t border-slate-700/50">
            <div>
              <label class="block text-slate-300 mb-1">Choose Question</label>
              <select
                name="security_question"
                class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-brand">
                <option value="">Select a question (optional)</option>
                {% for q in security_questions %}
                <option value="{{ q }}">{{ q }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label class="block text-slate-300 mb-1">Your Answer</label>
              <input
                name="security_answer"
                type="text"
                placeholder="Answer"
                class="w-full rounded-xl bg-slate-800 border border-slate-700 px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-brand" />
            </div>
          </div>
        </details>
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-brand hover:bg-sky-400 text-slate-950 font-bold px-4 py-2.5 text-sm transition-all transform active:scale-95 shadow-lg shadow-brand/20 mt-2">
        Create Account
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-slate-800/80 text-center text-xs text-slate-400">
      Already have an account?
      <a href="{{ url_for('login') }}" class="text-brand font-semibold hover:underline ml-1">Log in here</a>
    </div>
  </section>
</div>

<script>
  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      if (icon) icon.textContent = '🙈';
    } else {
      input.type = 'password';
      if (icon) icon.textContent = '👁️';
    }
  }
</script>
{% endblock %}
